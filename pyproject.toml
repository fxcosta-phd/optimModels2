[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimModels2"  # Replace with your new GitHub repository name (for pip install)
version = "0.1.0"
description = "Updated version of optimModels from https://github.com/andrepacofonseca/optimModels"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Felipe Costa", email = "fcosta@binghamton.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "cobra>=0.29",
    "framed>=0.5.2",
    "geckopy>=2.0.2",
    "inspyred>=1.0.3",
    "pandas>=2.1",
    "python-libsbml>=5.20",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pip-tools>=7.4",
    "pytest>=8.0",
    "pyupgrade>=3.17",
    "ruff>=0.7.0",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/fxcosta-phd/optimModels2"
Repository = "https://github.com/fxcosta-phd/optimModels2"
Issues = "https://github.com/fxcosta-phd/optimModels2/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["optimModels*"]

[tool.pytest.ini_options]
testpaths = ["unittests"]
python_files = ["*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "unittests"]